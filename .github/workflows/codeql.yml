name: codeql

on:
  push:
    branches: ["main", "release-readiness"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 08:00 UTC independent of push activity.
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL - Python security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    # CodeQL analysis itself is required. Security-alert thresholds are
    # enforced by branch protection/code-scanning settings and release gates.

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          languages: python
          # Use the default security-and-quality query suite for broad coverage.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4
        with:
          category: "/language:python"
