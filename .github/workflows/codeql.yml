name: codeql

on:
  push:
    branches: ["main", "release-readiness"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 08:00 UTC independent of push activity.
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL - Python security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    # CodeQL analysis itself is required. Security-alert thresholds are
    # enforced by branch protection/code-scanning settings and release gates.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: python
          # Use the default security-and-quality query suite for broad coverage.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:python"
